<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0038B8">
<meta name="application-name" content="קלפיות AI">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="קלפיות AI">
<meta name="description" content="עיר תלת-ממדית של אחוזי ההצבעה לכנסת ה-26 לפי יישוב, בהשוואה ל-2022">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>קלפיות AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: an app shell. Phone = one screen per tab, layers slide over it. Desktop = the 3D city is the stage, one 440px panel holds the active screen. */
:root{
  /* 6 theme colours = 6 voting profiles (from the 2022 result of each locality) */
  --p-haredi:#7C6CC4; --p-rz:#E8862E; --p-right:#2E6BE6; --p-center:#1FB0A0; --p-left:#E0477A; --p-arab:#3DBF5E; --p-none:#8C94AD;
  /* patriotic base: flag blue, white, Jerusalem gold */
  --flag:#0038B8; --flag-deep:#00247A; --gold:#C9A227; --gold-soft:#E9D18A; --white:#FFFFFF;
  --bg:#F3F6FC; --s1:#FFFFFF; --s2:#E8EEFA; --line:rgba(0,36,122,.14); --line-strong:rgba(0,36,122,.28);
  --ink:#071437; --ink2:#3C4C7A; --mute:#7A87AD; --on-flag:#FFFFFF;
  --up:#1A9D5C; --down:#D6354A;
  /* 3 depths */
  --d1:none; --d2:0 1px 2px rgba(7,20,55,.06),0 10px 30px -18px rgba(7,20,55,.35); --d3:0 24px 60px -24px rgba(7,20,55,.55),0 2px 6px rgba(7,20,55,.1);
  /* 4 text sizes */
  --t-xl:clamp(52px,15vw,84px); --t-l:22px; --t-m:15px; --t-s:12.5px;
  --font:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --serif:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --r:16px; --r-s:10px; --tab:62px; --panel:440px;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.64,1);
  --stage-bg:#DCE6FA; --stage-fog:#E9EFFB;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060C1F; --s1:#0D1733; --s2:#142047; --line:rgba(150,180,255,.16); --line-strong:rgba(150,180,255,.34);
  --ink:#F2F5FF; --ink2:#C0CCEE; --mute:#8291BE; --gold:#D9B54A; --gold-soft:#F0DEA0;
  --d2:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px -18px rgba(0,0,0,.9); --d3:0 30px 70px -24px rgba(0,0,0,.95),0 0 0 1px rgba(150,180,255,.12);
  --stage-bg:#050B22; --stage-fog:#071034; --p-right:#4C84FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060C1F; --s1:#0D1733; --s2:#142047; --line:rgba(150,180,255,.16); --line-strong:rgba(150,180,255,.34);
  --ink:#F2F5FF; --ink2:#C0CCEE; --mute:#8291BE; --gold:#D9B54A; --gold-soft:#F0DEA0;
  --d2:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px -18px rgba(0,0,0,.9); --d3:0 30px 70px -24px rgba(0,0,0,.95),0 0 0 1px rgba(150,180,255,.12);
  --stage-bg:#050B22; --stage-fog:#071034; --p-right:#4C84FF; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t-m);line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--flag);z-index:10}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:700;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;border-radius:0}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.small{font-size:var(--t-s);color:var(--mute)}
.num{font-weight:900;letter-spacing:-.02em}
.est{color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes kai-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kai-pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes kai-slide{from{transform:translateX(-100%)}to{transform:none}}
@keyframes kai-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kai-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes kai-dots{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}

/* ===== top bar ===== */
.top{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--flag);color:var(--on-flag);position:relative;z-index:6}
.top .brand{display:flex;align-items:center;gap:9px;min-width:0}
.top .brand svg{width:26px;height:26px;flex:none}
.top h1{font-size:19px;color:#fff;white-space:nowrap}
.top .date{font-size:var(--t-s);color:rgba(255,255,255,.78);white-space:nowrap}
.top .sp{flex:1}
.top .ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12);transition:background .2s}
.top .ib:hover{background:rgba(255,255,255,.22)}
.top .ib svg{width:19px;height:19px}
.top .ib.gold{background:var(--gold);color:#1a1200}
.live{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-size:var(--t-s);font-weight:500;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--gold-soft);animation:kai-pulse 2s infinite}

/* ===== shell ===== */
.app{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.panel{display:contents}
.screens{flex:1;min-height:0;position:relative;order:0}
.tabbar{order:1}
.screen{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;display:none;padding:14px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.screen.on{display:block;animation:kai-rise .35s var(--ease)}
.screen.tight{padding:0}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.shead h2{font-size:var(--t-l);flex:1;min-width:0}
.ibtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);border:1px solid var(--line);background:var(--s1);flex:none;transition:all .2s}
.ibtn:hover{border-color:var(--line-strong);color:var(--ink)}
.ibtn svg{width:17px;height:17px}
.ibtn.gold{background:var(--gold);border-color:var(--gold);color:#1a1200}

/* tab bar (phone) */
.tabbar{flex:none;height:calc(var(--tab) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr);background:var(--s1);border-top:1px solid var(--line);z-index:6;position:relative;padding-inline:max(0px,env(safe-area-inset-left,0px)) max(0px,env(safe-area-inset-right,0px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--mute);position:relative;transition:color .2s}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--flag)}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--flag)}
:root[data-theme="dark"] .tabbar button[aria-selected="true"]{color:var(--gold-soft)}
:root[data-theme="dark"] .tabbar button[aria-selected="true"]::before{background:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabbar button[aria-selected="true"]{color:var(--gold-soft)}:root:not([data-theme="light"]) .tabbar button[aria-selected="true"]::before{background:var(--gold)}}

/* ===== stage (3D) ===== */
.stage{position:absolute;inset:0 0 calc(var(--tab) + env(safe-area-inset-bottom,0px)) 0;background:var(--stage-bg);display:none;overflow:hidden}
.stage.on{display:block}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas.grab{cursor:grabbing}.stage canvas.pick{cursor:pointer}
.stage .labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;font-size:12px;font-weight:700;color:var(--ink);text-shadow:0 0 6px var(--stage-bg),0 0 12px var(--stage-bg);display:flex;flex-direction:column;align-items:center;line-height:1.15}
.lbl.on{opacity:1}
.lbl b{font-size:13px;font-weight:900}
.lbl small{font-weight:500;font-size:10.5px;color:var(--ink2)}
.lbl.wedge{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--c)}
.lbl.wedge small{color:var(--ink2);font-family:var(--font)}
/* the 3 elements allowed on the city */
.chip{position:absolute;top:12px;inset-inline-start:max(12px,env(safe-area-inset-right,0px));z-index:3;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 10px;border-radius:14px;background:var(--s1);box-shadow:var(--d3);border:1px solid var(--line);max-width:calc(100% - 80px);text-align:start}
.chip .n{font-size:26px;font-weight:900;line-height:1;color:var(--ink)}
.chip .n small{font-size:14px;font-weight:700}
.chip .l{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.chip .l b{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .l span{font-size:11px;color:var(--mute);white-space:nowrap}
.chip .dot{width:10px;height:10px;border-radius:3px;background:var(--c,var(--flag));flex:none;box-shadow:0 0 8px var(--c,transparent)}
.chip svg{width:16px;height:16px;color:var(--mute);flex:none}
.fsb{position:absolute;top:12px;inset-inline-end:max(12px,env(safe-area-inset-left,0px));z-index:3;width:44px;height:44px;border-radius:14px;background:var(--gold);color:#1a1200;display:grid;place-items:center;box-shadow:var(--d3)}
.fsb svg{width:20px;height:20px}
/* visible layout switch + colour legend on the city */
.citybar{position:absolute;top:66px;inset-inline-start:max(12px,env(safe-area-inset-right,0px));z-index:3;display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--d2)}
.citybar button{height:34px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:700;color:var(--mute);display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.citybar button svg{width:16px;height:16px}
.citybar button[aria-pressed="true"]{background:var(--flag);color:#fff}
.citybar #btnNorth{color:var(--gold)}
.citybar #cityView{color:var(--ink2);border-inline-start:1px solid var(--line);border-radius:0 10px 10px 0;margin-inline-start:2px}
.legend{position:absolute;inset-inline:max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.legend button{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2);box-shadow:var(--d2);transition:all .2s}
.legend button i{width:9px;height:9px;border-radius:3px;background:var(--c);box-shadow:0 0 6px var(--c)}
.legend button b{font-weight:900;color:var(--ink)}
.legend button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend button[aria-pressed="true"] b{color:var(--bg)}
.legend button.dim{opacity:.5}
.pick-card.on~.legend,.gest~.legend{display:none}
@media (max-width:899px){.citybar{top:66px}.citybar button{padding:0 9px;font-size:12px}.legend button{font-size:11px;padding:4px 8px 4px 7px}}
@media (min-width:900px){.citybar{top:72px;inset-inline-start:16px}.legend{inset-inline:auto 16px;justify-content:flex-start;max-width:60%}}
.stage.full .citybar{top:calc(72px + env(safe-area-inset-top,0px))}
.stage.full{position:fixed!important;inset:0!important;z-index:40;display:block}
.stage.full .fsb{top:calc(12px + env(safe-area-inset-top,0px))}
.stage.full .chip{top:calc(12px + env(safe-area-inset-top,0px))}
.pick-card{position:absolute;inset-inline:max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:none;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--s1);box-shadow:var(--d3);border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--flag));animation:kai-pop .3s var(--spring)}
.pick-card.on{display:grid}
.pick-card h3{font-family:var(--font);font-size:16px;font-weight:700}
.pick-card .m{font-size:var(--t-s);color:var(--mute)}
.pick-card .v{font-size:28px;font-weight:900;line-height:1;text-align:end}
.pick-card .v small{display:block;font-size:11px;font-weight:500;color:var(--mute);margin-top:2px}
.pick-card .x{position:absolute;top:-10px;inset-inline-end:-6px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;box-shadow:var(--d2)}
.pick-card .go{grid-column:1/-1;display:flex;gap:8px}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink2)}
.tipx{position:absolute;pointer-events:none;transform:translate(-50%,calc(-100% - 14px));background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:var(--d2);z-index:4}
.tipx.on{opacity:1}
.tipx b{display:block;font-size:14px}

/* ===== home ===== */
.hero{display:grid;gap:4px;padding:6px 0 14px;animation:kai-rise .5s var(--ease)}
.hero .when{display:flex;align-items:center;gap:8px;font-size:var(--t-s);color:var(--mute)}
.hero .when b{color:var(--ink);font-weight:700}
.hero .big{font-size:var(--t-xl);font-weight:900;line-height:.95;letter-spacing:-.03em;color:var(--flag);font-family:var(--font)}
:root[data-theme="dark"] .hero .big{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .big{color:#fff}}
.hero .big small{font-size:.42em;font-weight:700;color:var(--gold);margin-inline-start:2px}
.hero .lab{font-size:17px;font-weight:500;color:var(--ink2)}
.hero .row{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:var(--t-s);color:var(--mute)}
.hero .row b{color:var(--ink);font-size:15px;font-weight:700}
.hero .row .d{font-weight:700}
.hero .row .d.up{color:var(--up)}.hero .row .d.down{color:var(--down)}
.timeline{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 12px}
.timeline button{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--s1);min-width:72px;transition:all .2s}
.timeline button b{font-size:15px;font-weight:900}
.timeline button span{font-size:11px;color:var(--mute)}
.timeline button[aria-pressed="true"]{background:var(--flag);border-color:var(--flag);color:#fff}
.timeline button[aria-pressed="true"] span{color:rgba(255,255,255,.8)}
.timeline button.add{border-style:dashed;color:var(--mute);justify-content:center;font-size:20px;min-width:52px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--d2);margin-bottom:12px}
.card h3{font-family:var(--font);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h3 .small{font-weight:400;margin-inline-start:auto}
.prof{display:grid;gap:4px}
.prow{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:10px;padding:7px 4px;border-radius:10px;text-align:start;transition:background .15s;width:100%}
.prow:hover{background:var(--s2)}
.prow.on{background:var(--s2);box-shadow:inset 0 0 0 1px var(--line-strong)}
.prow.dim{opacity:.45}
.prow i{width:12px;height:12px;border-radius:4px;background:var(--c);box-shadow:0 0 8px var(--c)}
.prow .t{min-width:0;display:grid;gap:3px}
.prow .t b{font-size:14px;font-weight:700;line-height:1.2}
.prow .t small{font-size:11px;color:var(--mute);line-height:1.2}
.prow .bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;position:relative}
.prow.on .bar{background:var(--bg)}
.prow .bar i{position:absolute;inset:0 0 0 auto;width:var(--w);border-radius:3px;box-shadow:none;height:auto;transition:width .9s var(--ease)}
.prow .bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);inset-inline-start:var(--n);opacity:.7}
.prow .v{text-align:end;line-height:1.1}
.prow .v b{font-size:17px;font-weight:900;display:block}
.prow .v small{font-size:10.5px;color:var(--mute)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:8px 0 6px;background:var(--s2)}
.stack i{display:block;height:100%;background:var(--c);width:var(--w);transition:width .9s var(--ease)}
.stack i.other{background:repeating-linear-gradient(45deg,var(--mute) 0 3px,transparent 3px 6px);opacity:.6}
.keys{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--mute)}
.keys span{display:inline-flex;align-items:center;gap:5px}
.keys i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.keys i.other{background:repeating-linear-gradient(45deg,var(--mute) 0 2px,transparent 2px 4px)}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;padding:7px 8px;border-radius:9px;font-size:13px;font-weight:500;color:var(--mute);transition:all .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--s1);color:var(--ink);box-shadow:var(--d2);font-weight:700}

/* ===== list ===== */
.search{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.search label{flex:1;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--s1);height:44px}
.search label svg{width:18px;height:18px;color:var(--mute);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;height:100%;font-size:15px;outline:none}
.search input::placeholder{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
.chips button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:12.5px;font-weight:500;color:var(--ink2);transition:all .2s}
.chips button i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink2))}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sortrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:var(--t-s);color:var(--mute)}
.sortrow select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.rows{display:grid;gap:2px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:9px 8px;border-radius:12px;text-align:start;width:100%;transition:background .15s;border-inline-start:3px solid var(--c,transparent)}
.lrow:hover{background:var(--s2)}
.lrow .nm{font-weight:700;font-size:14.5px;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sub{grid-column:1;font-size:11px;color:var(--mute);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .pv{grid-row:1/3;text-align:end;line-height:1.05}
.lrow .pv b{font-size:19px;font-weight:900;display:block}
.lrow .pv small{font-size:10.5px;color:var(--mute)}
.lrow .bar{grid-column:1;height:4px;border-radius:2px;background:var(--s2);overflow:hidden;margin-top:3px}
.lrow .bar i{display:block;height:100%;width:var(--w);background:var(--c)}
.more{width:100%;padding:11px;border-radius:12px;border:1px dashed var(--line-strong);color:var(--ink2);font-weight:500;margin-top:10px}
.empty{padding:28px 10px;text-align:center;color:var(--mute)}

/* ===== groups ===== */
.grow{display:grid;grid-template-columns:1fr;gap:4px;padding:9px 6px;border-radius:12px;text-align:start;width:100%;transition:background .15s}
.grow:hover{background:var(--s2)}
.grow.on{background:var(--s2);box-shadow:inset 0 0 0 1px var(--line-strong)}
.grow.dim{opacity:.45}
.grow .h{display:flex;align-items:baseline;gap:8px}
.grow .h b{font-size:14px;font-weight:700}
.grow .h small{font-size:11px;color:var(--mute)}
.grow .h .v{margin-inline-start:auto;font-size:16px;font-weight:900}
.grow .h .v small{color:var(--mute);font-weight:500;margin-inline-start:3px}
.grow .trk{position:relative;height:var(--h,14px);border-radius:7px;background:var(--s2);overflow:visible}
.grow .trk .fill{position:absolute;inset:0 0 0 auto;width:var(--w);border-radius:7px;background:var(--c);transition:width .9s var(--ease)}
.grow .trk .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);inset-inline-start:var(--x);opacity:.75}
.grow .trk .mk.g{background:var(--gold);top:-6px;bottom:-6px;width:3px;opacity:1}
.legend-mk{display:flex;gap:14px;font-size:11px;color:var(--mute);margin-top:6px}
.legend-mk span{display:inline-flex;align-items:center;gap:5px}
.legend-mk i{width:2px;height:12px;background:var(--ink);opacity:.75}
.legend-mk i.g{background:var(--gold);width:3px;opacity:1}

/* ===== ask ===== */
.ask{display:flex;flex-direction:column;height:100%}
.ask .msgs{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.55;animation:kai-rise .3s var(--ease)}
.msg.u{align-self:flex-end;background:var(--flag);color:#fff;border-end-end-radius:6px;font-weight:500}
.msg.a{align-self:flex-start;background:var(--s1);border:1px solid var(--line);border-end-start-radius:6px;box-shadow:var(--d2)}
.msg.a b{color:var(--flag);font-weight:900}
:root[data-theme="dark"] .msg.a b{color:var(--gold-soft)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.a b{color:var(--gold-soft)}}
.msg .meta{display:block;font-size:10.5px;color:var(--mute);margin-top:6px}
.msg.sys{align-self:center;font-size:12px;color:var(--mute);text-align:center;max-width:100%}
.mbars{display:grid;gap:5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.mbars div{display:grid;grid-template-columns:minmax(70px,1fr) 2fr auto;gap:8px;align-items:center;font-size:12.5px}
.mbars .t{height:7px;border-radius:4px;background:var(--s2);overflow:hidden}
.mbars .t i{display:block;height:100%;background:var(--flag);width:var(--w);transition:width .8s var(--ease)}
.mbars b{font-weight:900}
.follow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.follow button,.sugg button{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:12.5px;font-weight:500;color:var(--ink2);text-align:start;transition:all .2s;white-space:nowrap}
.follow button:hover,.sugg button:hover{border-color:var(--gold);color:var(--ink)}
.think{display:flex;align-items:center;gap:8px;color:var(--ink2)}
.think i{width:6px;height:6px;border-radius:50%;background:var(--flag);animation:kai-dots 1.2s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));flex:none}
.sugg button{white-space:normal;text-align:start}
.composer{display:flex;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);flex:none;background:var(--s1)}
.composer input{flex:1;min-width:0;height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line-strong);background:var(--bg);font-size:15px}
.composer button{width:46px;height:46px;border-radius:14px;background:var(--flag);color:#fff;display:grid;place-items:center;flex:none}
.composer button:disabled{opacity:.5}
.composer svg{width:20px;height:20px}

/* ===== layer: locality ===== */
.layer{position:absolute;inset:0;z-index:5;background:var(--bg);overflow:auto;overscroll-behavior:contain;display:none;padding:12px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.layer.on{display:block;animation:kai-slide .38s var(--ease)}
.lnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lnav .back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--ink2)}
.lnav .back svg{width:16px;height:16px}
.lnav .sp{flex:1}
.lnav .pn{display:flex;gap:4px}
.lnav .pn button{height:36px;padding:0 10px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-size:12.5px;color:var(--ink2);font-weight:500}
.lhead{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.lhead h2{font-size:30px}
.lhead .tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--s2);font-size:11.5px;font-weight:500;color:var(--ink2)}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.lbig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 2px}
.lbig .v{font-size:64px;font-weight:900;line-height:1;letter-spacing:-.03em;color:var(--flag)}
:root[data-theme="dark"] .lbig .v{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lbig .v{color:#fff}}
.lbig .v small{font-size:26px;color:var(--gold);font-weight:700}
.lbig .l{font-size:16px;color:var(--ink2);font-weight:500}
.lbig .d{font-size:13px;font-weight:700}
.lbig .d.up{color:var(--up)}.lbig .d.down{color:var(--down)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.g2 div{padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}
.g2 b{display:block;font-size:20px;font-weight:900;line-height:1.1}
.g2 small{display:block;color:var(--mute);font-size:11px;margin-top:3px;line-height:1.3}
.cmp{display:grid;gap:7px}
.cmp div{display:grid;grid-template-columns:minmax(90px,110px) 1fr 54px;align-items:center;gap:8px;font-size:12.5px}
.cmp .t{position:relative;height:9px;border-radius:5px;background:var(--s2)}
.cmp .t i{position:absolute;inset:0 0 0 auto;border-radius:5px;background:var(--c);width:var(--w);transition:width .9s var(--ease)}
.cmp b{text-align:end;font-weight:900}
.cmp b small{font-weight:500;color:var(--mute)}
.blocs{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--s2);margin:6px 0}
.blocs i{display:block;height:100%;background:var(--c);width:var(--w)}
.blocs i.other{background:repeating-linear-gradient(45deg,var(--mute) 0 3px,transparent 3px 6px);opacity:.6}
.trend{display:flex;gap:6px;flex-wrap:wrap}
.trend span{display:inline-flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:10px;background:var(--s2);font-size:11px;color:var(--mute);line-height:1.2}
.trend span b{font-size:14px;color:var(--ink);font-weight:900}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{height:44px;padding:0 16px;border-radius:12px;background:var(--flag);color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:transform .2s;box-shadow:var(--d2)}
.btn:hover{transform:translateY(-1px)}
.btn.q{background:var(--s1);color:var(--ink2);border:1px solid var(--line);box-shadow:none}
.btn.gold{background:var(--gold);color:#1a1200}
.btn svg{width:17px;height:17px}
.btn:disabled{opacity:.5;transform:none}

/* ===== ticker (news flashes per screen) ===== */
.ticker{flex:none;order:1;height:34px;display:flex;align-items:stretch;background:var(--flag-deep);color:#fff;overflow:hidden;position:relative;z-index:6;border-top:1px solid rgba(255,255,255,.12)}
.tk-pause{width:36px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff}
.tk-pause svg{width:14px;height:14px}
.tk-pause[aria-pressed="true"]{background:var(--gold);color:#1a1200}
.tk-viewport{flex:1;min-width:0;overflow:hidden;position:relative}
.tk-track{position:absolute;top:0;inset-inline-start:0;height:100%;display:flex;align-items:center;gap:0;white-space:nowrap;will-change:transform;animation:kai-tk var(--dur,60s) linear infinite}
.ticker.paused .tk-track,.ticker.hold .tk-track{animation-play-state:paused}
.tk-track button{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;font-size:13.5px;font-weight:500;color:#fff;white-space:nowrap;border-inline-end:1px solid rgba(255,255,255,.14)}
.tk-track button em{font-style:normal;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--gold-soft);font-weight:700}
.tk-track button b{color:var(--gold-soft);font-weight:900}
.tk-track button i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--gold));flex:none}
.tk-track button:hover{background:rgba(255,255,255,.08)}
@keyframes kai-tk{from{transform:translateX(0)}to{transform:translateX(50%)}}
@media (prefers-reduced-motion:reduce){.tk-track{animation:none;position:static;overflow:auto}}
@media (min-width:900px){.ticker{order:2;height:36px;border-top:1px solid var(--line)}}
/* leaders for displaced labels */
.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.leaders line{stroke:var(--ink);stroke-opacity:.45;stroke-width:1}
.lbl.pin{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px;background:var(--s1);padding:2px 6px}
.lbl.sel b{color:var(--gold)}
.dragging{cursor:grabbing!important;user-select:none}
.gest{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;width:min(420px,calc(100% - 24px));padding:12px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--d3);animation:kai-pop .5s var(--spring);transition:opacity .4s,transform .4s}
.gest.off{opacity:0;transform:translate(-50%,10px)}
.gest svg{width:34px;height:34px;color:var(--gold);grid-row:1/3}
.gest b{display:block;font-size:14.5px;font-weight:700}
.gest span{display:block;font-size:12px;color:var(--mute);line-height:1.4;margin-top:2px}
.gest button{grid-column:2;justify-self:start;height:34px;padding:0 14px;border-radius:10px;background:var(--flag);color:#fff;font-weight:700;font-size:13px}
.pick-card.on~.gest{display:none}
.chip,.pick-card{touch-action:none}
/* sparklines & charts in cards */
.spark{display:block;width:100%;height:auto;overflow:visible}
.spark text{font-family:var(--font);font-size:12px;fill:var(--mute)}
.spark .v{font-weight:700;fill:var(--ink);font-size:12.5px}
.spark .nat{stroke:var(--flag);stroke-width:2.5;fill:none}
.spark .ref{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.spark .g{stroke-width:2;fill:none}
.spark .ax{stroke:var(--line-strong);stroke-width:1}
.spark .grid{stroke:var(--line);stroke-width:1}
.spark .dot{stroke:var(--s1);stroke-width:2}
.mini{display:inline-block;width:44px;height:16px;vertical-align:middle;margin-inline-start:6px}
.mini polyline{fill:none;stroke:var(--c,var(--flag));stroke-width:1.6}
.mini circle{fill:var(--c,var(--flag))}
.hero .curve{margin:10px 0 2px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.kpis div{padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);border-top:3px solid var(--c,var(--flag))}
.kpis b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.kpis small{display:block;font-size:11px;color:var(--mute);margin-top:2px;line-height:1.3}
.kpis .d{font-size:11.5px;font-weight:700}
.kpis .up{color:var(--up)}.kpis .down{color:var(--down)}
.lede{font-size:15px;line-height:1.55;color:var(--ink2);margin:0 0 10px;padding:12px 14px;border-radius:12px;background:var(--s2);border-inline-start:4px solid var(--gold)}
.lede b{color:var(--ink)}
.chg{display:grid;gap:5px}
.chg div{display:grid;grid-template-columns:minmax(80px,120px) 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.chg .t{height:8px;border-radius:4px;background:var(--s2);position:relative;overflow:hidden}
.chg .t i{position:absolute;inset:0 0 0 auto;width:var(--w);background:var(--c);border-radius:4px}
.chg b{font-weight:900;white-space:nowrap}
.lrow .sub .up{color:var(--up)}.lrow .sub .down{color:var(--down)}
/* clear controls: labels beside icons where there is room */
.top .ib{width:auto;min-width:38px;padding:0 10px;gap:6px;font-size:12.5px;font-weight:500}
.top .ib span{display:none}
@media (min-width:900px){.top .ib span{display:inline}.fsb{width:auto;padding:0 14px;gap:8px;font-weight:700;font-size:13px}.fsb span{display:inline}}
.fsb span{display:none}
.fsb{display:flex;align-items:center;justify-content:center}

/* ===== duels ===== */
.duels{display:grid;gap:10px}
.duel{display:grid;gap:8px;padding:12px 12px 10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);text-align:start;width:100%;transition:border-color .2s}
.duel:hover{border-color:var(--line-strong)}
.duel .dt{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:15px;font-weight:700}
.duel .dt small{font-size:12px;font-weight:600;color:var(--gold)}
.duel .ds{display:grid;grid-template-columns:minmax(96px,1.1fr) 2fr auto;gap:8px;align-items:center}
.duel .dn{font-size:13px;font-weight:700;line-height:1.2;color:var(--c)}
.duel .dn small{display:block;font-size:10.5px;font-weight:400;color:var(--mute)}
.duel .db{position:relative;height:12px;border-radius:6px;background:var(--s2);overflow:visible}
.duel .db i{position:absolute;inset:0 0 0 auto;width:var(--w);border-radius:6px;background:var(--c)}
.duel .db em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);inset-inline-start:var(--n);opacity:.7}
.duel .dv{font-size:18px;font-weight:900;text-align:end;line-height:1;min-width:58px}
.duel .dv small{display:block;font-size:10px;font-weight:500;color:var(--mute);margin-top:2px}
.duel .dv .up{color:var(--up)}.duel .dv .down{color:var(--down)}

/* ===== reports ===== */
.repgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.repgrid button{display:grid;gap:3px;padding:11px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:start;transition:all .2s}
.repgrid button:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.repgrid button b{font-size:14px;font-weight:700}
.repgrid button small{font-size:11px;color:var(--mute);line-height:1.3}
.rep-h{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.rep-h h2{font-size:26px}
.rep-h .small{line-height:1.4}
.rt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.rt th{text-align:start;font-weight:500;color:var(--mute);padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
.rt td{padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.rt td.n{font-weight:700;white-space:normal;min-width:120px;line-height:1.25}
.rt td.n .small{font-weight:400;font-size:11px}
.rt td.v{font-weight:900;font-size:14px}
.rt td .d{font-size:11px;font-weight:700}
.rt .up{color:var(--up)}.rt .down{color:var(--down)}
.rt .bar{display:inline-block;width:52px;height:6px;border-radius:3px;background:var(--s2);vertical-align:middle;margin-inline-start:6px;position:relative;overflow:hidden}
.rt .bar i{position:absolute;inset:0 0 0 auto;width:var(--w);background:var(--c);border-radius:3px}
.rt tr[data-n]{cursor:pointer}
.rt tr[data-n]:hover td{background:var(--s2)}
/* report rows as cards: everything visible, nothing scrolls sideways */
.rcards{display:grid;gap:8px}
.rcard{display:grid;gap:6px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--flag));text-align:start;width:100%}
.rcard.btn-like{cursor:pointer}
.rcard .h{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.rcard .h b{font-size:14.5px;font-weight:700;line-height:1.2}
.rcard .h small{grid-column:1;font-size:11px;color:var(--mute);line-height:1.3}
.rcard .h .v{grid-row:1/3;font-size:20px;font-weight:900;text-align:end;line-height:1}
.rcard .h .v small{display:block;font-size:10.5px;color:var(--mute);font-weight:500;margin-top:2px}
.rcard .t{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mute)}
.rcard .t span b{color:var(--ink);font-weight:700;margin-inline-start:3px}
.rcard .t span.now b{color:var(--c,var(--flag))}
.rcard .m{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}
.rcard .m b{font-weight:700}
.rcard .m .up{color:var(--up)}.rcard .m .down{color:var(--down)}
.rcard .bar{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;position:relative}
.rcard .bar i{position:absolute;inset:0 0 0 auto;width:var(--w);background:var(--c);border-radius:3px}
.rcard .bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);inset-inline-start:var(--n);opacity:.7}
.ins{display:grid;gap:8px}
.ins div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13.5px;line-height:1.5}
.ins div b.k{font-size:20px;font-weight:900;line-height:1.1;color:var(--c,var(--flag));white-space:nowrap}
.ins div b.k small{display:block;font-size:10.5px;font-weight:500;color:var(--mute)}
.tline{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px;margin:6px 0 2px}
.tline div{padding:8px 6px;border-radius:10px;background:var(--bg);border:1px solid var(--line);text-align:center}
.tline b{display:block;font-size:18px;font-weight:900}
.tline small{font-size:11px;color:var(--mute)}
@media print{.top,.tabbar,.stage,.btns,.lnav{display:none!important}.layer{position:static;overflow:visible}body,html{overflow:visible;height:auto}}

/* ===== sheets ===== */
.veil{position:fixed;inset:0;z-index:30;background:rgba(3,8,30,.5);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.veil.on{display:flex}
.sheet{width:100%;max-height:min(86%,760px);overflow:auto;overscroll-behavior:contain;background:var(--s1);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--d3);animation:kai-sheet .4s var(--ease)}

.sheet .vt.e{background:rgba(201,162,39,.16);color:var(--gold)}

      if(filter.k){const g=groups(filter.k).find(x=>x.name===filter.v);if(g)push(`מסנן <b>${esc(filter.v)}</b>: ${g.n} יישובים · ${f1(g.wt)}% הצביעו · ${signed(g.wt-s.pct)} מול הארצי`,()=>sheet.filterPick(),colorOf(filter.k,filter.v));const fl=rows.filter(matches).filter(r=>r.elig>=2000);const h=[...fl].sort((a,b)=>b.pct-a.pct)[0],l=[...fl].sort((a,b)=>a.pct-b.pct)[0];if(h)push(`הגבוה ב${esc(filter.v)}: ${mov(h)}`,()=>loc.open(h.name));if(l)push(`הנמוך ב${esc(filter.v)}: ${mov(l)}`,()=>loc.open(l.name))}
      else{push(`מוביל: <b>${esc(top[0].name)}</b> ${f1(top[0].wt)}% הצביעו`,()=>setFilter('profile',top[0].name,true),colorOf('profile',top[0].name));const lo=top[top.length-1];push(`מפגר: <b>${esc(lo.name)}</b> ${f1(lo.wt)}% הצביעו`,()=>setFilter('profile',lo.name,true),colorOf('profile',lo.name))}
      if(p){const ris=rows.filter(r=>r.delta!=null&&r.elig>=5000).sort((a,b)=>b.delta-a.delta)[0];if(ris)push(`המזנק מאז ${p.time}: <b>${esc(ris.name)}</b> ${signed(ris.delta)} נק׳`,()=>loc.open(ris.name))}
      const bh=[...big].sort((a,b)=>b.pct-a.pct)[0],bl=[...big].sort((a,b)=>a.pct-b.pct)[0];if(bh)push(`עיר גדולה מובילה: ${mov(bh)}`,()=>loc.open(bh.name));if(bl)push(`עיר גדולה מפגרת: ${mov(bl)}`,()=>loc.open(bl.name));
      if(city.lostAnchor)push(`${city.lostAnchor.n} יישובים ללא מיקום במפה עומדים בגוש בים`,()=>sheet.info('city'));
      duels.list().forEach(d=>push(`${esc(d.a.name)} <b>${f1(d.a.wt)}%</b> מול ${esc(d.b.name)} <b>${f1(d.b.wt)}%</b> · ${esc(d.verdict)}`,()=>reports.open('duels'),d.a.wt>=d.b.wt?d.a.c:d.b.c,'מי מול מי'));
      P.forEach(g=>push(`${esc(g.name)}: <b>${f1(g.wt)}%</b> הצביעו · ${f1(g.share)}% מהבוחרים`,()=>setFilter('profile',g.name,true),colorOf('profile',g.name),'פרופיל'));
      S.slice(0,4).forEach(g=>push(`${esc(g.name)}: <b>${f1(g.wt)}%</b> הצביעו`,()=>setFilter('sector',g.name,true),colorOf('sector',g.name),'מגזר'));
      const kib=Ty.find(g=>g.name==='קיבוץ'),mos=Ty.find(g=>g.name==='מושב / קהילתי'),cty=Ty.find(g=>g.name==='עיר');if(kib&&mos)push(`קיבוצים <b>${f1(kib.wt)}%</b> · מושבים <b>${f1(mos.wt)}%</b>${cty?' · ערים <b>'+f1(cty.wt)+'%</b>':''} הצביעו`,()=>{render.gkey='type';nav.tab('groups');render.groups()},'var(--gold)','סוג');
      push(`סופי 2022: <b>${REF.final}%</b> · חסרות <b>${f1(Math.max(0,REF.final-s.pct))}</b> נק׳ להשוואה`,()=>sheet.info('home'),'var(--gold)','2022');
      big.sort((a,b)=>b.elig-a.elig).slice(0,8).forEach(r=>push(`${esc(r.name)}: <b>${f1(r.pct)}%</b> הצביעו · ${signed(r.pct-s.pct)} מול ארצי`,()=>loc.open(r.name),colorOf('profile',r.profile),'עיר'));
      const ex=explained();push(`<b>${fmt(Math.max(0,s.voters-ex.votes))}</b> מצביעים מחוץ ליישובים (מעטפות כפולות ועוד)`,()=>sheet.info('home'),'var(--p-none)','אחר')}
    else if(scr==='list'){const fl=rows.filter(matches);push(`<b>${fl.length}</b> יישובים${filter.k?' ב'+esc(filter.v):''} · חציון ${f1(median(fl.filter(r=>r.pct>=3).map(r=>r.pct)))}% הצביעו`);const ab=fl.filter(r=>r.pct>=s.pct).length;push(`<b>${ab}</b> מעל הארצי (${f1(s.pct)}%), ${fl.length-ab} מתחת`);const h=[...fl].filter(r=>r.elig>=2000).sort((a,b)=>b.pct-a.pct)[0],l=[...fl].filter(r=>r.elig>=2000).sort((a,b)=>a.pct-b.pct)[0];if(h)push(`הגבוה: ${mov(h)}`,()=>loc.open(h.name));if(l)push(`הנמוך: ${mov(l)}`,()=>loc.open(l.name));if(p){fl.filter(r=>r.delta!=null&&r.elig>=5000).sort((a,b)=>b.delta-a.delta).slice(0,4).forEach(ris=>push(`מזנק: <b>${esc(ris.name)}</b> ${signed(ris.delta)} נק׳ מאז ${p.time}`,()=>loc.open(ris.name),colorOf('profile',ris.profile),'מגמה'));fl.filter(r=>r.delta!=null&&r.elig>=5000).sort((a,b)=>a.delta-b.delta).slice(0,2).forEach(r=>push(`הכי איטי: <b>${esc(r.name)}</b> ${signed(r.delta)} נק׳`,()=>loc.open(r.name),'var(--down)','מגמה'))}
      [...fl].filter(r=>r.elig>=20000).sort((a,b)=>b.pct-a.pct).slice(0,5).forEach(r=>push(`${esc(r.name)}: <b>${f1(r.pct)}%</b> הצביעו`,()=>loc.open(r.name),colorOf('profile',r.profile),'גדולה'))}
    else if(scr==='groups'){const k=render.gkey;const G=groups(k);const t=[...G].sort((a,b)=>b.wt-a.wt);push(`<b>${esc(t[0].name)}</b> מובילים: ${f1(t[0].wt)}% הצביעו`,()=>setFilter(k,t[0].name),colorOf(k,t[0].name));const lo=t[t.length-1];push(`<b>${esc(lo.name)}</b> אחרונים: ${f1(lo.wt)}% הצביעו`,()=>setFilter(k,lo.name),colorOf(k,lo.name));const bg=[...G].sort((a,b)=>b.contrib-a.contrib)[0];push(`הכי הרבה נקודות לארצי: <b>${esc(bg.name)}</b> ${f1(bg.contrib)} מתוך ${f1(s.pct)}`,null,colorOf(k,bg.name));if(p){const Gp=groupsAt(cur-1,k).groups;const mv=[...G].filter(g=>Gp[g.name]).sort((a,b)=>(b.wt-Gp[b.name].wt)-(a.wt-Gp[a.name].wt))[0];if(mv)push(`המזנקים מאז ${p.time}: <b>${esc(mv.name)}</b> ${signed(mv.wt-Gp[mv.name].wt)} נק׳`,()=>setFilter(k,mv.name),colorOf(k,mv.name))}}
    else if(scr==='ask'){['סיכום המצב ב-4 משפטים','ימין מול שמאל: מי מצביע יותר?','ערבים מול יהודים עכשיו','מי תורם הכי הרבה לאחוז הארצי?','איזו עיר גדולה הכי רחוקה מ-2022?','הקיבוצים מול המושבים','מה קרה בנגב מאז הצהריים?','ירושלים מול בני ברק'].forEach(q=>push(`${q}`,()=>ask.send(q),'var(--gold)','שאל'));push(`ארצי <b>${f1(s.pct)}%</b> הצביעו · ${esc(s.time)}`,null)}
    return out},
  render(){const items=this.items();if(!items.length){$('ticker').hidden=true;return}$('ticker').hidden=false;const html=items.map((x,i)=>`<button data-i="${i}" style="--c:${x.c||'var(--gold)'}"><i></i>${x.t}</button>`).join('');$('tkTrack').innerHTML=html+html;
    $('tkTrack').querySelectorAll('button').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];if(it.go)it.go()});requestAnimationFrame(()=>{const w=$('tkTrack').scrollWidth/2;$('tkTrack').style.setProperty('--dur',Math.max(20,Math.round(w/55))+'s')})}};
/* ===== auto refresh: every 15 minutes until 01:00 (Israel), picks up newly published data ===== */
const autoRefresh={until:new Date('2026-10-28T12:00:00+02:00').getTime(),every:15*60*1000,t0:Date.now(),
  next(){const now=Date.now();if(now>this.until)return null;return Math.max(1,Math.ceil((this.t0+this.every-now)/60000))},
  init(){if(window.claude)return;setInterval(()=>{const now=Date.now();if(now>this.until)return;if(now-this.t0>=this.every&&document.visibilityState==='visible'&&!ask.busy){toast('מרענן נתונים…');setTimeout(()=>location.reload(),600)}},30000)}};

/* ===== install as an app ===== */
const install={ev:null,ios:/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream,standalone:matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,
  init(){if(this.standalone)return;addEventListener('beforeinstallprompt',e=>{e.preventDefault();this.ev=e;this.show()});if(this.ios&&location.protocol==='https:'&&!/claude/.test(location.host))this.show();
    addEventListener('appinstalled',()=>{$('btnInstall').hidden=true;toast('קלפיות AI הותקן. פתח מהמסך הראשי.')})},
  show(){const b=$('btnInstall');b.hidden=false;b.classList.add('gold');b.onclick=()=>this.go()},
  async go(){if(this.ev){this.ev.prompt();const r=await this.ev.userChoice.catch(()=>null);if(r&&r.outcome==='accepted'){$('btnInstall').hidden=true}this.ev=null;return}
    sheet.open(`<button class="ibtn close" data-close aria-label="סגירה">✕</button><h2>להתקין כאפליקציה</h2><p>באייפון: לוחצים על כפתור <b>שיתוף</b> (הריבוע עם החץ למעלה) בתחתית ספארי, ואז <b>"הוסף למסך הבית"</b>. האפליקציה נפתחת במסך מלא, בלי סרגל כתובת.</p><p>באנדרואיד ובמחשב: בכרום, תפריט ⋮ ואז <b>"התקן אפליקציה"</b> או <b>"הוסף למסך הבית"</b>.</p>`);$('sheet').querySelector('[data-close]').onclick=()=>sheet.close()}};
/* ===== boot ===== */
window.KAI={city,loc,sheet,nav,snaps,ask,reports,get rows(){return rows},get filter(){return filter},setFilter,show};
theme.init();nav.init();install.init();derive(snaps.length-1);cur=snaps.length-1;ask.init();render.groups();city.init();show(snaps.length-1);ticker.init();autoRefresh.init();draggable($('chip'),'chip');draggable($('pick'),'pick');
(async()=>{if(!window.claude||!claude.use)return;
  try{sampleFn=await claude.use('sample')}catch(_){}
  try{userRef=await claude.use('user')}catch(_){}
  try{dbRef=await claude.use('db');if(!dbRef)return;dbRef.collection('snapshots').onSnapshot(qs=>{let changed=false;qs.docs.forEach(d=>{const s=d.data();if(!s||!s.rows)return;const i=snaps.findIndex(x=>x.key===s.key);if(i<0){snaps.push(s);changed=true}else if(JSON.stringify(snaps[i].rows)!==JSON.stringify(s.rows)){snaps[i]=s;changed=true}});
    if(changed){snaps.sort((a,b)=>a.key.localeCompare(b.key));show(snaps.length-1);toast(`${snaps.length} נקודות זמן נטענו`)}},e=>console.warn('db',e))}catch(_){}
})();
</script>
